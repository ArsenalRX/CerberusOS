# Limine boot menu for the Cerberus ISO.
timeout: 1
default_entry: 1
# Mirror the bootloader console on COM1 so the serial log shows the hand-off.
serial: yes

/Cerberus
    protocol: limine
    path: boot():/boot/cerberus.elf
    # The boot archive: the first user programs, as a tar file the kernel reads.
    module_path: boot():/boot/initrd.tar
